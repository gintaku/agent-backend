[alembic]
script_location = alembic
prepend_sys_path = .

# Timezone-aware, sortable revision filenames: YYYY_MM_DD_HHMM_slug.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sqlalchemy.url is intentionally NOT set here — env.py pulls the real DSN
# from config.get_settings().db_write_url at runtime, so this file never
# needs to embed (or accidentally leak) a connection string, and always
# tracks whatever DATABASE_WRITE_URL / .env currently points at.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S